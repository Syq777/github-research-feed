name: Validate skill and generated repositories
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      - run: python3 -B scripts/init_repo.py --check
      - run: python3 -B -m unittest discover -s tests
      - name: Test a generated research repository
        run: |
          python3 -B scripts/init_repo.py --repo "$RUNNER_TEMP/research-check" --topic rsi
          cd "$RUNNER_TEMP/research-check"
          python3 -B -m unittest discover -s tests
